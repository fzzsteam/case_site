name: Deploy SAE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 构建镜像并部署到 SAE

    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 检查 ACR Secrets
        run: |
          if [ -z "${{ secrets.ACR_USERNAME }}" ] || [ -z "${{ secrets.ACR_PASSWORD }}" ]; then
            echo "缺少 ACR_USERNAME 或 ACR_PASSWORD secrets"
            echo "请到 GitHub Organization/Repository Secrets 确认："
            echo "1. secret 名称是否为 ACR_USERNAME / ACR_PASSWORD"
            echo "2. 该组织 secret 是否授权给 case_site 仓库"
            exit 1
          fi

      - name: 设置 Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 ACR（阿里云深圳）
        uses: docker/login-action@v4
        with:
          registry: crpi-7ajeyduewy90avu4.cn-shenzhen.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 安装 aliyun CLI
        run: |
          curl -sLo /tmp/aliyun-cli.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf /tmp/aliyun-cli.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/aliyun

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # ACR Personal 不接受 BuildKit provenance/SBOM 生成的 OCI attestation manifest。
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.fzzsai.com
          tags: |
            crpi-7ajeyduewy90avu4.cn-shenzhen.personal.cr.aliyuncs.com/fzzs/case_site:latest
            crpi-7ajeyduewy90avu4.cn-shenzhen.personal.cr.aliyuncs.com/fzzs/case_site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 部署到 SAE 生产应用
        env:
          ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_SAE_AK_ID }}
          ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_SAE_AK_SECRET }}
          ALIBABACLOUD_REGION_ID: ${{ vars.SAE_REGION_ID }}
          SAE_PROD_APP_ID: ${{ secrets.SAE_PROD_APP_ID }}
        run: |
          if [ -z "$SAE_PROD_APP_ID" ]; then
            echo "SAE_PROD_APP_ID 未配置，跳过生产部署"
            exit 0
          fi

          IMAGE="crpi-7ajeyduewy90avu4-vpc.cn-shenzhen.personal.cr.aliyuncs.com/fzzs/case_site:${{ github.sha }}"

          aliyun sae DeployApplication \
            --AppId "$SAE_PROD_APP_ID" \
            --ImageUrl "$IMAGE"

          echo "SAE 生产环境部署已触发，请在控制台确认发布状态"
          echo "镜像：$IMAGE"
